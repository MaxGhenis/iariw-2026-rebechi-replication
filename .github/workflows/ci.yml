name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.11.2"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: replication/uv.lock

      - name: Sync Python environment
        working-directory: replication
        run: uv sync --locked

      - name: Lint Python package
        working-directory: replication
        run: uv run ruff check .

      - name: Test Python package
        working-directory: replication
        run: uv run pytest -q

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto report
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/replication/.venv/bin/python
          JUPYTER_PREFER_ENV_PATH: "1"
        run: quarto render replication/report

      - name: Upload Quarto report
        uses: actions/upload-artifact@v4
        with:
          name: replication-report
          path: replication/report/_output/index.html
          if-no-files-found: error
